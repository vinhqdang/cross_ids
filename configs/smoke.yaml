# Fast end-to-end check on synthetic domains (no downloads needed).
source: synthetic
synthetic:
  n_domains: 3
  n: 600
  seed: 0
schema: core
seeds: [0]
test_size: 0.3
modes: [transductive, inductive]
device: cpu
threads: 1
fewshot_k: [1, 5]
results_dir: results/smoke
methods:
  - lr
  - rf
  - hgb
  - catboost
  - xgboost
  - mlp
  - coral
  - dann
  - rift
  - rift-noDN
  - rift-noAnchor
  - rift-noIFS
  - rift-noLSC
  - rift-robust
  - rift-standard
  - rift-st
experiments: [indomain, pairwise, lodo, fewshot]
