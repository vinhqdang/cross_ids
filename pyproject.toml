[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crossids"
version = "0.1.0"
description = "Cross-dataset flow-based intrusion detection benchmark with the RIFT method"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "scikit-learn",
    "pyarrow",
    "pyyaml",
    "catboost",
    "torch",
]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
crossids = "crossids.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not slow'"
markers = ["slow: long CPU learning checks, run with -m slow"]
