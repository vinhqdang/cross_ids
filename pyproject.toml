[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crossids"
version = "0.1.0"
description = "Cross-dataset flow-based intrusion detection benchmark with the RIFT method"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "scikit-learn",
    "pyarrow",
    "pyyaml",
    "catboost",
    "xgboost",
    "matplotlib",
    "tabulate",
    "threadpoolctl",
    "torch",
]

[project.optional-dependencies]
test = ["pytest"]
# TabPFN baselines of the few-label study (weights need a Prior Labs license for versions other than v2)
tabpfn = ["tabpfn", "huggingface_hub"]
# TABPFN_BACKEND=api: send the support and query rows to the Prior Labs service
tabpfn-api = ["tabpfn-client"]
# Windows certificate store for the downloads
windows = ["truststore"]

[project.scripts]
crossids = "crossids.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not slow'"
markers = ["slow: long CPU learning checks, run with -m slow"]
